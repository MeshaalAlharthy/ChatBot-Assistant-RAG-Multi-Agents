name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (unit tests do not load the reranker or the web interface)
        run: |
          python -m pip install --upgrade pip
          pip install -r <(grep -vE '^(sentence-transformers|streamlit)==' requirements.txt) pytest==8.4.2
          pip install -e . --no-deps

      - name: Compile every module
        run: python -m compileall -q src scripts evals tests

      - name: Run unit tests
        run: pytest -v
