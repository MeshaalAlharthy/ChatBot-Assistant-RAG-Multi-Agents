[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistant"
version = "1.0.0"
description = "A fully local Arabic RAG assistant with three security agents, classification-aware access control and personal-data protection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Meshaal Al-Harthi" }]
requires-python = ">=3.10"
keywords = ["rag", "arabic", "langgraph", "multi-agent", "ollama", "access-control", "data-governance"]
dynamic = ["dependencies"]

[project.optional-dependencies]
eval = ["ragas==0.4.3", "langchain-community==0.4.1"]
dev = ["pytest==8.4.2"]

[project.urls]
Repository = "https://github.com/MeshaalAlharthy/ChatBot-Assistant-RAG-Multi-Agents"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
